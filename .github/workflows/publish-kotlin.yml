name: Publish stockseyes (Kotlin)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 0.1.0)'
        required: true
        type: string

defaults:
  run:
    working-directory: kotlin

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Set version
        run: |
          sed -i 's/^version = .*/version = "${{ github.event.inputs.version }}"/' build.gradle.kts

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build and Publish to Maven Central
        run: ./gradlew publish
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}

      - name: Commit, tag, and push
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git add build.gradle.kts
          git commit -m "chore(kotlin): release stockseyes v$VERSION"
          git tag "kotlin-v$VERSION"
          git push
          git push --tags
